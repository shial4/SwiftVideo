name: Android tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    # Apple Silicon hosted runners cannot start a nested Android VM.
    runs-on: macos-26-intel
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SWIFT_VERSION: '6.3.2'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.8.2'
      - name: Install pinned Skip and Swift toolchains
        run: |
          curl -fL https://github.com/skiptools/skip/releases/download/1.9.19/skip-macos.zip -o "$RUNNER_TEMP/skip.zip"
          echo "e7337fcbfaf2e39b0a5ad312e83feba35832b09950076524e1ef530ea250579b  $RUNNER_TEMP/skip.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/skip.zip" -d "$RUNNER_TEMP/skip"
          echo "$RUNNER_TEMP/skip/skip.artifactbundle/macos" >> "$GITHUB_PATH"
          curl -fL https://download.swift.org/swiftly/darwin/swiftly.pkg -o "$RUNNER_TEMP/swiftly.pkg"
          installer -pkg "$RUNNER_TEMP/swiftly.pkg" -target CurrentUserHomeDirectory
          "$HOME/.swiftly/bin/swiftly" init --skip-install --assume-yes --no-modify-profile
          source "$HOME/.swiftly/env.sh"
          swiftly install "$SWIFT_VERSION"
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/skip/skip.artifactbundle/macos/skip" android sdk install --version "$SWIFT_VERSION" --ndk-version r27d
          echo "ANDROID_NDK_ROOT=" >> "$GITHUB_ENV"
      - name: Select compatible host SDK
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Generate test bridge metadata
        run: |
          SKIP_DYNAMIC_LIBRARIES=1 swift build --build-system native --scratch-path .build-media3 --target SwiftVideoTests
          modules=(.build-media3/plugins/outputs/*/SwiftVideoTests/destination/skipstone/SwiftVideo)
          echo "ANDROID_MODULE=$PWD/${modules[0]}" >> "$GITHUB_ENV"
      - name: Compile native library and test bundle
        run: |
          skip android build --swift-version "$SWIFT_VERSION" --arch x86_64 --scratch-path .build-android \
            --product SwiftVideo -d "$ANDROID_MODULE/build/jni-libs"
          skip android test --swift-version "$SWIFT_VERSION" --arch x86_64 --scratch-path .build-android \
            --testing-library testing --build-test-libs "$ANDROID_MODULE/build/test-jni-libs"
      - name: Run both Android test layers
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: |
            skip android test --swift-version "$SWIFT_VERSION" --arch x86_64 --scratch-path .build-android-coverage --testing-library testing --no-cleanup --remote-folder /data/local/tmp/swiftvideo-coverage --env 'LLVM_PROFILE_FILE=/data/local/tmp/swiftvideo-coverage/coverage-%m.profraw' -Xswiftc -DSWIFTVIDEO_CORE_COVERAGE -Xswiftc -profile-generate -Xswiftc -profile-coverage-mapping
            (cd "$ANDROID_MODULE/.." && SKIP_BRIDGE_ANDROID_BUILD_DISABLED=1 skip gradle :SwiftVideo:connectedDebugAndroidTest)
            mkdir -p .build-coverage/android
            adb shell 'cd /data/local/tmp/swiftvideo-coverage && tar -cf /data/local/tmp/swiftvideo-profiles.tar coverage-*.profraw'
            adb pull /data/local/tmp/swiftvideo-profiles.tar .build-coverage/android/profiles.tar
      - name: Report and gate coverage
        run: |
          mkdir -p .build-coverage/android
          tar -xf .build-coverage/android/profiles.tar -C .build-coverage/android
          ndk_tool=$(find "$HOME/.swiftpm" "$HOME/Library/org.swift.swiftpm" -path '*swift-6.3.2*android-ndk-r27d*/bin/llvm-profdata' -type f 2>/dev/null | head -1)
          test -n "$ndk_tool"
          "$ndk_tool" merge -sparse .build-coverage/android/*.profraw -o .build-coverage/android/coverage.profdata
          "$(dirname "$ndk_tool")/llvm-cov" export .build-android-coverage/x86_64-unknown-linux-android28/debug/libSwiftVideo.so \
            -instr-profile=.build-coverage/android/coverage.profdata > .build-coverage/android/core-raw.json
          swift Tools/Coverage.swift android-core .build-coverage/android/core-raw.json .build-coverage/android/core.json 90
          curl -fL https://repo.maven.apache.org/maven2/org/jacoco/org.jacoco.cli/0.8.13/org.jacoco.cli-0.8.13-nodeps.jar -o "$RUNNER_TEMP/jacoco.jar"
          coverage_file=$(find "$ANDROID_MODULE/build/outputs/code_coverage" -name '*.ec' | head -1)
          java -jar "$RUNNER_TEMP/jacoco.jar" report "$coverage_file" \
            --classfiles "$ANDROID_MODULE/../SwiftVideoMedia3/build/intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes" \
            --sourcefiles "$ANDROID_MODULE/../SwiftVideoMedia3/src/main/kotlin" \
            --xml .build-coverage/android/media3.xml --html .build-coverage/android/media3-html
          swift Tools/Coverage.swift android-media3 .build-coverage/android/media3.xml .build-coverage/android/media3.json 75
          cp "$ANDROID_MODULE/build/outputs/androidTest-results/connected/debug/swt-events.jsonl" .build-coverage/android/
      - name: Build the example editor
        run: |
          SKIP_DYNAMIC_LIBRARIES=1 swift build --build-system native --package-path Example --scratch-path Example/.build-host --target SwiftVideoEditor
          mkdir -p Example/.build-host/Build/Products/Debug Example/.build-host/Build/Intermediates.noindex
          ln -s ../../plugins/outputs Example/.build-host/Build/Intermediates.noindex/BuildToolPluginIntermediates
          editor_modules=(Example/.build-host/plugins/outputs/*/SwiftVideoEditor/destination/skipstone/SwiftVideoEditor)
          editor_jni="$PWD/${editor_modules[0]}/build/jni-libs"
          (cd Example && skip android build --swift-version "$SWIFT_VERSION" --arch x86_64 \
            --scratch-path .build-android --product SwiftVideoEditor -d "$editor_jni")
          SKIP_DYNAMIC_LIBRARIES=1 SKIP_BRIDGE_ANDROID_BUILD_DISABLED=1 \
            BUILT_PRODUCTS_DIR="$PWD/Example/.build-host/Build/Products/Debug" gradle --no-daemon -p Example/Android :app:assembleDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-test-results
          path: .build-coverage
          retention-days: 14
