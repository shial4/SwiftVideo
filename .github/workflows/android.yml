name: Android tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
env:
  # setup-gradle retains the local task cache as well as dependency downloads.
  GRADLE_OPTS: -Dorg.gradle.caching=true
jobs:
  build:
    # Skip code generation and native cross-compilation run on macOS.
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android
      - name: Generate test bridge metadata
        run: |
          SKIP_DYNAMIC_LIBRARIES=1 xcrun swift build --build-system native --scratch-path .build-media3 --target SwiftVideoTests
          modules=(.build-media3/plugins/outputs/*/SwiftVideoTests/destination/skipstone/SwiftVideo)
          echo "ANDROID_MODULE=$PWD/${modules[0]}" >> "$GITHUB_ENV"
      - name: Compile native library and test bundle
        run: |
          skip android build --swift-version "$SWIFT_VERSION" --arch x86_64 --scratch-path .build-android \
            --product SwiftVideo -d "$ANDROID_MODULE/build/jni-libs"
          skip android test --swift-version "$SWIFT_VERSION" --arch x86_64 --scratch-path .build-android \
            --testing-library testing --build-test-libs "$ANDROID_MODULE/build/test-jni-libs"
      - name: Package portable Android tests
        run: bash Tools/BuildAndroidTests.sh
      - uses: actions/upload-artifact@v7
        with:
          name: android-test-binaries
          path: |
            .build-android-tests/core
            .build-android-tests/tests.apk
            .build-android-tests/media3
            .build-android-tests/segmentation-media3
          include-hidden-files: true
          retention-days: 3
  example:
    # Independent of the test binaries: tests can start as soon as build finishes.
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android
      - name: Build the example editor
        run: |
          SKIP_DYNAMIC_LIBRARIES=1 xcrun swift build --build-system native --package-path Example --scratch-path Example/.build-host --target SwiftVideoEditor
          mkdir -p Example/.build-host/Build/Products/Debug Example/.build-host/Build/Intermediates.noindex
          ln -s ../../plugins/outputs Example/.build-host/Build/Intermediates.noindex/BuildToolPluginIntermediates
          editor_modules=(Example/.build-host/plugins/outputs/*/SwiftVideoEditor/destination/skipstone/SwiftVideoEditor)
          editor_jni="$PWD/${editor_modules[0]}/build/jni-libs"
          (cd Example && skip android build --swift-version "$SWIFT_VERSION" --arch x86_64 \
            --scratch-path .build-android --product SwiftVideoEditor -d "$editor_jni")
          SKIP_DYNAMIC_LIBRARIES=1 SKIP_BRIDGE_ANDROID_BUILD_DISABLED=1 \
            BUILT_PRODUCTS_DIR="$PWD/Example/.build-host/Build/Products/Debug" gradle --no-daemon -p Example/Android :app:assembleDebug
  tests:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: android-test-binaries
          path: .build-android-tests
      - name: Allow emulator access to KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Run both Android test layers
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 2
          emulator-build: '15507667' # 36.6.11
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 4096 -accel on
          pre-emulator-launch-script: '"$ANDROID_HOME/emulator/emulator" -accel-check'
          # A complete suite already exceeds five minutes on a healthy emulator.
          # Leave time for diagnostics, but still terminate a hung test process.
          script: timeout --kill-after=30s 15m bash Tools/TestAndroid.sh
      - name: Report and gate coverage
        run: |
          tar -xf .build-coverage/android/profiles.tar -C .build-coverage/android
          ndk_bin="$ANDROID_HOME/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$ndk_bin/llvm-profdata" merge -sparse .build-coverage/android/*.profraw -o .build-coverage/android/coverage.profdata
          "$ndk_bin/llvm-cov" export .build-android-tests/core/libSwiftVideo.so \
            -instr-profile=.build-coverage/android/coverage.profdata > .build-coverage/android/core-raw.json
          swift Tools/Coverage.swift android-core .build-coverage/android/core-raw.json .build-coverage/android/core.json 90
          "$ndk_bin/llvm-cov" export .build-android-tests/core/libSwiftVideoSegmentation.so \
            -instr-profile=.build-coverage/android/coverage.profdata > .build-coverage/android/segmentation-core-raw.json
          swift Tools/Coverage.swift android-segmentation-core .build-coverage/android/segmentation-core-raw.json .build-coverage/android/segmentation-core.json 90
          curl -fL https://repo.maven.apache.org/maven2/org/jacoco/org.jacoco.cli/0.8.13/org.jacoco.cli-0.8.13-nodeps.jar -o "$RUNNER_TEMP/jacoco.jar"
          java -jar "$RUNNER_TEMP/jacoco.jar" report .build-coverage/android/media3.ec \
            --classfiles .build-android-tests/media3/classes \
            --sourcefiles .build-android-tests/media3/kotlin \
            --xml .build-coverage/android/media3.xml --html .build-coverage/android/media3-html
          swift Tools/Coverage.swift android-media3 .build-coverage/android/media3.xml .build-coverage/android/media3.json 75
          java -jar "$RUNNER_TEMP/jacoco.jar" report .build-coverage/android/media3.ec \
            --classfiles .build-android-tests/segmentation-media3/classes \
            --sourcefiles .build-android-tests/segmentation-media3/kotlin \
            --xml .build-coverage/android/segmentation-media3.xml --html .build-coverage/android/segmentation-media3-html
          swift Tools/Coverage.swift android-segmentation-media3 .build-coverage/android/segmentation-media3.xml .build-coverage/android/segmentation-media3.json 75
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-test-results
          path: .build-coverage
          include-hidden-files: true
          retention-days: 14
