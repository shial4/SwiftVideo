# Skip configuration for SwiftVideoEditor module
#
# Kotlin dependencies and Gradle build options for this module can be configured here
#build:
#  contents:
#    - block: 'dependencies'
#      contents:
#        - 'implementation("androidx.compose.runtime:runtime")'

# this is a natively-compiled Skip Fuse module
skip:
  mode: 'native'

# The app must declare the alpha's SDK before dependency defaults are aggregated.
settings:
  contents:
    - block: 'dependencyResolutionManagement'
      contents:
        - block: 'versionCatalogs'
          contents:
            - block: 'create("libs")'
              contents:
                - 'version("android-sdk-compile", "37")'
