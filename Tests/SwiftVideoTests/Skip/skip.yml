# Skip configuration for SwiftVideoTests module

build:
  contents:
    # Skip folds the native test target into the core Gradle module. Keep the
    # optional module test-only so it cannot form SwiftVideo -> Segmentation -> SwiftVideo.
    - block: 'dependencies'
      export: false
      remove:
        - 'implementation("com.google.mediapipe:tasks-vision:1.2.2")'
      contents:
        - 'testImplementation(project(":SwiftVideoSegmentation"))'
        - 'androidTestImplementation(project(":SwiftVideoSegmentation"))'
    # Project dependencies are appended after Skip merges the dependency blocks,
    # so scope these after the generated dependencies declaration has executed.
    - 'configurations.getByName("api").dependencies.removeAll { it is ProjectDependency && it.name in setOf("SwiftVideoSegmentation", "SwiftVideoSegmentationMedia3") }'
    - block: 'android'
      contents:
        - 'sourceSets { getByName("androidTest") { assets.srcDir("src/test/assets") } }'
        - 'buildTypes { getByName("debug") { enableAndroidTestCoverage = true } }'

skip:
  mode: 'native'
